name: Deploy worker
# v2.3.1641: workflow_dispatch added after a REAL miss.  On 2026-08-06 the
# squash-merge of PR #360 (45dbc50, server/** changed) produced NO Actions
# run at all — neither this workflow nor Server CI — while the Cloudflare
# Pages integration built the same commit seconds later, so the push
# unambiguously happened and GitHub simply dropped the Actions events.
# The server half of that merge (monster AI) therefore sat in main, unshipped,
# with no way to notice except reading the run list.
#
# Before this, the ONLY path to production was the push trigger below, so a
# dropped event had no recovery: there is no run to re-run, and CLAUDE.md
# forbids deploying the worker from a laptop (a stale local deploy on
# 2026-06-10 rolled back three weeks of server work and broke combat in
# production — the reason this repo is a monorepo).  The remaining options
# were both bad: push a no-op commit to main purely to re-trigger, or deploy
# by hand.
#
# Dispatching this deploys whatever `main` currently holds, which is exactly
# what the push trigger would have done — same code, same wrangler, same
# secret.  It adds no new authority: anyone who can dispatch it can already
# merge to main and trigger it that way.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['server/**']
# v2.3.3176: ONE DEPLOY AT A TIME, THE NEWEST LAST.  Each run deploys the
# commit that started it, and whichever `wrangler deploy` finishes LAST is
# what players get.  Two server merges a minute apart used to run side by
# side, so if the older one finished second, production quietly ran the
# older code (missing the newer merge) until the next server merge.  In a
# concurrency group a new run waits for the running one, and a newer run
# replaces any run still waiting -- so the last to deploy is always the
# newest main.  cancel-in-progress stays false: a deploy is never cut off
# half-way.
concurrency:
  group: deploy-worker
  cancel-in-progress: false
jobs:
  # v2.3.3302: THE SUITE BEFORE THE DEPLOY.  This workflow deployed whatever
  # main held without running a test (the architecture review, 2026-10-17):
  # two PRs green on their own and red together, or one merged before its CI
  # finished, went straight to the players.  Now `deploy` waits for the whole
  # server suite on the same commit, and a red suite deploys nothing --
  # production stays on the last good version.  A failed run is re-run from
  # the Actions tab once the cause is fixed (a flaky check: just re-run).
  #
  # Its own job, so the deploy job is exactly what it was: a fresh checkout
  # with no node_modules, where wrangler-action installs the wrangler it has
  # always deployed with (3.90.0 today).  `npm ci` in the deploy job would
  # hand it the project's own wrangler (4.x) instead -- a change of deploy
  # tool nobody asked for, and one this repo cannot test.
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test
  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      # wrangler-action@v3 still declares node20, which GitHub retires
      # Sept 2026; this opts its steps into the node24 runtime now.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: server
