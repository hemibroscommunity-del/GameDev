name: Optimize sprite assets

# Converts sprite-sheet PNGs to LOSSLESS WebP (smaller downloads) and commits the
# .webp next to the .png. Runs on CI because the dev sandbox has no image tooling.
#
# v2.3.2328: THIS WORKFLOW HAD NEVER RUN. Its trigger only fired when the
# converter or the workflow file itself changed, so in the whole history there is
# no "lossless WebP sprite copies" commit — every .webp in the repo had been made
# by hand with tools/webp_convert.mjs, a Chromium-canvas encoder that is lossy by
# construction. 78 of 118 twins differed from their PNG (worst channel 255) and
# the client prefers .webp, so the drifted pixels were the ones players saw.
# Measured by tools/qa/qa-webp-lossless.mjs; the 78 were deleted in that version.
#
# So the trigger now includes the sprite art itself, which is what actually wants
# converting. Two things stop the bot's own commit from looping back into this:
# GitHub does not start a workflow run for a push authored with the repo's
# GITHUB_TOKEN (documented), and the job-level `if` below refuses a bot actor
# anyway. What it deliberately does NOT use is a [skip ci] marker in the commit
# message: Cloudflare Pages honours that marker too, so the regenerated art would
# land in git and never reach the site until somebody else happened to push.
on:
  workflow_dispatch:
  push:
    paths:
      - 'public/sprites/player/**'
      - 'public/sprites/gear/**'
      - 'tools/optimize-sprites.mjs'
      - '.github/workflows/optimize-assets.yml'

permissions:
  contents: write

jobs:
  optimize:
    # Belt and braces against a loop; the GITHUB_TOKEN rule above already covers it.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install sharp
        run: npm i --no-save sharp@0.33.5
      # The converter verifies every twin against its source and deletes any that
      # is not pixel-identical or is not smaller, so a lossy or useless file can
      # no longer reach the repo. It exits non-zero only if EVERY file failed.
      - name: Convert PNG -> lossless WebP (verified)
        run: node tools/optimize-sprites.mjs
      - name: Commit WebP copies
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/sprites
          if git diff --cached --quiet; then
            echo "No WebP changes to commit."
          else
            git commit -m "chore: lossless WebP sprite copies for smaller downloads"
            git push
          fi
