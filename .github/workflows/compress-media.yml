# Runner-side media compressor (v2.3.1112). This sandbox has no ffmpeg, so a
# few media assets shipped large. This workflow runs ffmpeg on a GitHub runner
# and commits the smaller result back to the branch.
#
# Videos were already compressed in an earlier run (committed once); that step
# has been REMOVED so re-runs don't re-encode the already-H.264 mp4s and lose a
# generation of quality each time. This run now only handles audio (SFX).
name: Compress media
# Runs when THIS workflow file is pushed (so it fires once when added/edited and
# its own media commit doesn't re-trigger it), or manually. Bump the token to
# re-run on a later push.
# rerun-token: 3
on:
  push:
    paths:
      - '.github/workflows/compress-media.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Show ffmpeg
        run: ffmpeg -version | head -1
      - name: Compress SFX (.wav/.flac -> AAC .m4a) + trim footstep
        run: |
          set -e
          # Game SFX ship as uncompressed PCM .wav (+ one .flac); re-encode each
          # to a sibling iOS-friendly AAC .m4a at 96k. The .wav/.flac originals
          # are KEPT here so this commit stays self-consistent (the manifest
          # still points at them); a follow-up code commit flips the manifest to
          # .m4a and deletes the originals. decodeAudioData on iOS Safari decodes
          # AAC natively, so playback is unchanged.
          # NOTE: -nostdin is REQUIRED inside `while read` — ffmpeg otherwise
          # consumes the loop's stdin and eats the next filename's first char.
          find public/sfx -type f \( -name '*.wav' -o -name '*.flac' \) | while read -r f; do
            out="${f%.*}.m4a"
            ffmpeg -nostdin -y -loglevel error -i "$f" -c:a aac -b:a 96k -movflags +faststart "$out"
            echo "$(basename "$f") -> $(basename "$out") ($(($(stat -c%s "$f")/1024))KB -> $(($(stat -c%s "$out")/1024))KB)"
          done
          # The footstep clip is a 25 s continuous walk; the game only ever plays
          # its first ~0.75 s (two isolated footfalls). Trim to 0.8 s in place.
          FS=public/sfx/footstep/footstep-v2.mp3
          if [ -f "$FS" ]; then
            ffmpeg -nostdin -y -loglevel error -i "$FS" -t 0.8 -c:a libmp3lame -b:a 128k "$FS.tmp.mp3"
            if [ "$(stat -c%s "$FS.tmp.mp3")" -lt "$(stat -c%s "$FS")" ]; then
              mv "$FS.tmp.mp3" "$FS"; echo "footstep-v2.mp3 trimmed to 0.8s"
            else
              rm -f "$FS.tmp.mp3"; echo "footstep-v2.mp3 kept original"
            fi
          fi
      - name: Commit + push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/
          if git diff --cached --quiet; then
            echo "nothing changed; nothing to commit"
          else
            git commit -m "Compress SFX to AAC .m4a + trim footstep (ffmpeg) — smaller download"
            git push origin HEAD:${{ github.ref_name }}
          fi
