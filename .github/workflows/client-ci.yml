# Client CI — lint + build on every PR (v2.3.765).
#
# Born from the v2.3.756 incident: an out-of-scope const reference shipped to
# production as a per-frame ReferenceError.  `eslint src` (no-undef + a few
# correctness rules, see eslint.config.js) catches that class before merge;
# the build catches parse/import breakage.  The deeper runtime smoke test
# (tools/qa-smoke.mjs) needs a browser and stays a session-side tool.
name: Client CI
on:
  pull_request:
    paths: ['src/**', 'package.json', 'eslint.config.js']
jobs:
  lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run build
