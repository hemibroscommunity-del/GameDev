# Client CI — lint + build + runtime smoke on every PR.
#
# Born from the v2.3.756 incident: an out-of-scope const reference shipped to
# production as a per-frame ReferenceError.  `eslint src` (no-undef + a few
# correctness rules, see eslint.config.js) catches that class before merge;
# the build catches parse/import breakage.
#
# v2.3.1105: the runtime smoke test (tools/qa/qa-smoke.mjs) now runs in CI
# too — it boots the BUILT client against a LOCAL worker (`wrangler dev`,
# Miniflare — no Cloudflare account/token needed; the only bindings are
# SQLite-backed Durable Objects, fully emulated), joins as "QA Bot", walks
# for ~1 min, and fails on: never joined, any uncaught page error, or a
# captured crash log.  This is the only client<->worker integration gate,
# so server/** changes trigger this workflow as well.
#
# v2.3.1196: three more harnesses run after the blocking pair, REPORT-ONLY
# (continue-on-error) until they prove stable — combat-prediction
# reconciliation (qa-combat-predict), armored-sprite rendering
# (qa-gear-smoke, cover for the armor-art work), and the party HUD
# (qa-party-smoke).  Promotion criteria are on the steps below.
#
# v2.3.1333 (owner directive, 2026-07-16): the smoke job NO LONGER runs
# on PRs — "there aren't live players and it slows down production for
# no reason."  PRs gate on lint-build only.  The job and its harnesses
# are kept behind workflow_dispatch (Actions tab -> Client CI -> Run
# workflow) for on-demand integration checks; re-adding it to the PR
# path is an owner call, not a "fix".
#
# v2.3.1729 (owner call, 2026-08-15): ONE scenario comes back to the PR
# path — `playable`, below.  The condition in the 2026-07-16 directive has
# changed: there ARE live players now, and the cost of that gate being
# absent was measured rather than theorised.  v2.3.1715 shipped a desktop
# regression that made every modal in the game unreachable — the Mayor Bro
# line could not be started, advanced or turned in — and it survived SIX
# versions in production.  tools/qa/mp/mp-questline.mjs catches it on the
# first action, and had been failing since the day it broke with nobody
# listening, because it ran nowhere but a developer's sandbox.
#
# Deliberately ONE scenario, not the suite: this is the "can a new player
# play the game" test, it is the cheapest possible answer to the question
# that actually bit us, and a five-minute PR gate that people respect beats
# a twenty-minute one they learn to skip.  The rest stay on
# workflow_dispatch.
name: Client CI
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'server/**'
      - 'tools/qa/mp/**'
      - 'package.json'
      - 'eslint.config.js'
      - 'vite.config.js'
      - '.github/workflows/client-ci.yml'
jobs:
  lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # ── v2.3.1729: the playable-path gate (see the header note) ──
  # Runs the full Mayor Bro questline through a REAL browser against a REAL
  # worker: accept, travel, kill, return, hand in, equip the payouts, walk
  # home.  65 assertions, ~2 min of scenario on top of install+build.
  # (v2.3.1732 added the "left the spoke by its own return marker" assertion.)
  #
  # BLOCKING, with the repo's established retry-once shape.  Report-only was
  # considered and rejected: this regression already spent six versions
  # going unread, and a check nobody has to act on is the state we are
  # leaving, not a milder version of the fix.  If it proves flaky, loosen
  # the specific assertion — do not quietly add continue-on-error.
  #
  # run.mjs boots its own worker (wrangler --local) and static dist server,
  # so there is no service plumbing here; it only needs both installs, a
  # build, and a browser.  The harness picks up Playwright's managed
  # Chromium when the sandbox's pinned one is absent (v2.3.1729).
  playable:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: server
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: The questline is completable (one retry; second gets a warmed DO)
        run: |
          node tools/qa/mp/run.mjs questline \
            || { echo "first attempt failed, retrying"; node tools/qa/mp/run.mjs questline; }

  smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: server
      - run: npm run build
      - run: npx playwright install --with-deps chromium-headless-shell
      - name: Start local worker (wrangler dev, Miniflare)
        run: nohup npx wrangler dev --port 8787 > ../wrangler.log 2>&1 &
        working-directory: server
      - name: Start vite preview (serves dist/ on 4173)
        # --host 127.0.0.1 pins the IPv4 loopback: with the default
        # "localhost" host, the runner binds ::1 only and the readiness
        # probe below (127.0.0.1) never connects.
        run: nohup npm run preview -- --port 4173 --strictPort --host 127.0.0.1 > preview.log 2>&1 &
      - name: Wait for servers (lobby probe doubles as DO cold-start warm-up)
        run: |
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8787/api/lobby > /dev/null && break
            if [ "$i" = 60 ]; then echo "worker never came up"; cat wrangler.log; exit 1; fi
            sleep 1
          done
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4173/ > /dev/null && break
            if [ "$i" = 30 ]; then echo "preview never came up"; cat preview.log; exit 1; fi
            sleep 1
          done
      - name: Run smoke test (one retry; second attempt gets a warmed DO)
        env:
          QA_WS_URL: ws://127.0.0.1:8787
        run: |
          node tools/qa/qa-smoke.mjs > qa-smoke.json \
            || { echo "first attempt failed, retrying"; node tools/qa/qa-smoke.mjs > qa-smoke.json; }
      - name: Run facing regression (two sessions; v2.3.1109)
        env:
          QA_WS_URL: ws://127.0.0.1:8787
        run: |
          node tools/qa/qa-facing.mjs > qa-facing.json \
            || { echo "first attempt failed, retrying"; node tools/qa/qa-facing.mjs > qa-facing.json; }
      # ── v2.3.1196: candidate gates, REPORT-ONLY while they earn trust ──
      # Same retry-once pattern as the blocking harnesses above, but
      # continue-on-error: a flaky BLOCKING check trains everyone to
      # ignore red, which is worse than no check.  None of the three has
      # had a real stabilization run yet (authored where npm is
      # policy-blocked, so no local build/worker was possible).
      # PROMOTION CRITERIA: once a step holds green — including its one
      # retry — for ~10 consecutive CI runs, delete its
      # `continue-on-error: true` line to make it blocking.  If one keeps
      # flaking, fix or loosen the specific failing check (headers of
      # each harness say which checks are the likely offenders) rather
      # than leaving it report-only forever.
      #
      # ═══ v2.3.2067: WHY ALL THREE ARE STILL REPORT-ONLY ═══
      # (handoff backlog item F, worked end to end against a real local
      # stack — wrangler dev + vite preview + real Chromium.)
      #
      # READ THE LOG, NOT THE TICK.  `continue-on-error: true` makes a
      # FAILED step report `conclusion: success` in the Actions UI and
      # API, so "check the Actions history per harness" cannot answer the
      # promotion question at all: the last completed dispatch (run 1431,
      # 2026-08-26) is a green job whose log contains "6 GEAR-SMOKE
      # CHECK(S) FAILED".  Any future count of consecutive green runs has
      # to come from the step's OUTPUT.
      #
      # Per harness, as of this version:
      #   combat-predict — CANNOT PASS, and not for a flaky reason.  It
      #     walks town -> worldview -> ember on a v2.3.1190 route, and
      #     leaving town is now gated twice: the Mayor gate (v2.3.1676,
      #     needs quest tut_1 accepted) and the per-zone quest unlock
      #     (v2.3.1817, enforced server-side in movement.js).  It dies on
      #     its first assertion, "A reached worldview", having ghost-
      #     hopped onto the exit tile and bounced.  Promoting it means
      #     giving it the questline prologue tools/qa/mp/mp-questline.mjs
      #     already drives — a rewrite, not a tune.
      #   gear-smoke — REPAIRED THIS VERSION (three stale assumptions,
      #     see the harness header); 12/12 PASS, four consecutive local
      #     runs, and the gating metric went from 0.0034 (below its own
      #     noise floor) to 0.2229, ~13x it.  Still report-only ONLY
      #     because the criterion above is CI runs and this sampling code
      #     has none: it wants a stabilization series on this job before
      #     the line below comes out.
      #   party-smoke — 11/11 of its own checks PASS, then it dies
      #     clicking Leave: the World Chat feed (v2.3.2037) is drawn over
      #     the party roster and takes the tap.  That is a live UI
      #     regression, not harness rot — measured at 844x390 with the
      #     band at --dash-h 265px, the feed lands at y 84..117 and the
      #     Leave button is at y 98..122 — and where the feed goes
      #     instead is an owner/design call (zLayers.js puts it at 25,
      #     deliberately above the roster's 16), so it is reported rather
      #     than guessed at here.
      - name: Combat-prediction reconciliation (two sessions; v2.3.1196, report-only)
        continue-on-error: true
        env:
          QA_WS_URL: ws://127.0.0.1:8787
        run: |
          node tools/qa/qa-combat-predict.mjs > qa-combat-predict.json \
            || { echo "first attempt failed, retrying"; node tools/qa/qa-combat-predict.mjs > qa-combat-predict.json; }
      - name: Gear rendering smoke (armored sprites; v2.3.1196, report-only)
        continue-on-error: true
        env:
          QA_WS_URL: ws://127.0.0.1:8787
        run: |
          node tools/qa/qa-gear-smoke.mjs > qa-gear-smoke.json \
            || { echo "first attempt failed, retrying"; node tools/qa/qa-gear-smoke.mjs > qa-gear-smoke.json; }
      - name: Party HUD smoke (two sessions; v2.3.1196, report-only)
        continue-on-error: true
        env:
          QA_WS_URL: ws://127.0.0.1:8787
        run: |
          node tools/qa/qa-party-smoke.mjs > qa-party-smoke.json \
            || { echo "first attempt failed, retrying"; node tools/qa/qa-party-smoke.mjs > qa-party-smoke.json; }
      - name: Show smoke output
        if: always()
        run: |
          cat qa-smoke.json || true
          cat qa-facing.json || true
          cat qa-combat-predict.json || true
          cat qa-gear-smoke.json || true
          cat qa-party-smoke.json || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: qa-smoke-failure
          path: |
            qa-smoke.json
            qa-facing.json
            qa-combat-predict.json
            qa-gear-smoke.json
            qa-party-smoke.json
            /tmp/qa-login.png
            wrangler.log
            preview.log
          if-no-files-found: ignore
