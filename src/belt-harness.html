<!doctype html>
<!-- v2.3.1349: headless ground-truth harness — renders the REAL masked-body
     bake (chain waist paint included) + gear layers for every jog frame per
     direction, exactly as entityRenderer composes them.  Driven by
     tools/qa/belt-harness-shot.mjs; not linked from the game. -->
<html>
<head><meta charset="utf-8"><title>belt harness</title>
<style>body{background:#3c4048;margin:0} canvas{display:block;margin:6px;image-rendering:pixelated}</style>
</head>
<body>
<div id="boards"></div>
<script type="module">
import { getBodyFrame } from './rendering/playerSkins.js';
import { getGearFrame } from './rendering/gearSheets.js';
import { frameCount, loadPlayerSprites } from './rendering/playerSprites.js';
import { _maskedBodyFrame } from './rendering/systems/entityRenderer.js';

const DIRS = ['south', 'north', 'east', 'northeast', 'southwest'];
const SKIN = 'default', PANTS = 'default', SHOES = 'default';
const wait = (ms) => new Promise(r => setTimeout(r, ms));

async function ready(fn, tries = 200) {
  for (let t = 0; t < tries; t++) {
    const v = fn();
    if (v) return v;
    await wait(50);
  }
  return null;
}

function drawTex(ctx, tex, dx, dy, scale = 1) {
  const src = tex && tex.source && tex.source.resource;
  if (!src) return;
  const f = tex.frame;
  ctx.drawImage(src, f.x, f.y, f.width, f.height, dx, dy, 256 * scale, 256 * scale);
}

async function board(dir) {
  const n = frameCount('jog', dir) || 1;
  const cols = Math.min(n, 7);
  const rows = Math.ceil(n / cols);
  const Z = 1.6;
  const cv = document.createElement('canvas');
  cv.width = Math.round(cols * 256 * Z / 2) * 2;
  cv.height = Math.round(rows * 256 * Z / 2) * 2;
  cv.id = 'board-' + dir;
  const ctx = cv.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = '#3c4048';
  ctx.fillRect(0, 0, cv.width, cv.height);
  for (let f = 0; f < n; f++) {
    const body = await ready(() => getBodyFrame(SKIN, PANTS, SHOES, 'jog', dir, f, null, 'none'));
    const chest = await ready(() => getGearFrame('chest', 'steelplate', 'jog', dir, f));
    const legs = await ready(() => getGearFrame('legs', 'steelgreaves', 'jog', dir, f));
    const belt = await ready(() => getGearFrame('belt', 'chainbelt', 'jog', dir, f), 60);
    if (f === 0) console.log('[harness]', dir, 'body=', !!body, 'chest=', !!chest, 'legs=', !!legs, 'belt=', !!belt);
    if (!body || !chest || !legs) continue;
    const worn = [{ k: 'chest:steelplate', tex: chest }, { k: 'legs:steelgreaves', tex: legs }];
    let masked = null;
    for (let t = 0; t < 40 && !masked; t++) {
      try { masked = _maskedBodyFrame(body, worn, 6, { pose: 'jog', dir, frameIdx: f }); } catch (e) { break; }
      if (masked && belt === null) break;
      if (!masked) await wait(50);
    }
    const dx = (f % cols) * 256 * Z, dy = Math.floor(f / cols) * 256 * Z;
    drawTex(ctx, masked || body, dx, dy, Z);
    drawTex(ctx, legs, dx, dy, Z);
    drawTex(ctx, chest, dx, dy, Z);
    ctx.fillStyle = '#ffdd44'; ctx.font = '20px monospace';
    ctx.fillText(dir + ' f' + f, dx + 8, dy + 24);
  }
  document.getElementById('boards').appendChild(cv);
}

(async () => {
  await loadPlayerSprites();
  for (const d of DIRS) await board(d);
  window.__done = true;
})();
</script>
</body>
</html>
