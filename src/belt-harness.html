<!doctype html>
<!-- v2.3.1349: headless ground-truth harness — renders the REAL masked-body
     bake (chain waist paint included) + gear layers for every jog frame per
     direction, exactly as entityRenderer composes them.  Driven by
     tools/qa/belt-harness-shot.mjs; not linked from the game. -->
<html>
<head><meta charset="utf-8"><title>belt harness</title>
<style>body{background:#3c4048;margin:0} canvas{display:block;margin:6px;image-rendering:pixelated}</style>
</head>
<body>
<div id="boards"></div>
<script type="module">
import { getBodyFrame, getPickupHeadFrame } from './rendering/playerSkins.js';
import { getGearFrame, getGearFramePhased } from './rendering/gearSheets.js';
import { frameCount, loadPlayerSprites } from './rendering/playerSprites.js';
import { _maskedBodyFrame } from './rendering/systems/entityRenderer.js';

const DIRS = ['south', 'north', 'east', 'northeast', 'southwest'];
// ?layers=body draws ONLY the masked-body bake (debug decomposition)
const MODE = new URLSearchParams(location.search).get('layers') || 'all';
// ?wear=chest | legs | full (default): partial-wear rendering (v2.3.1360 —
// chest-only/legs-only jog broke unseen because the harness only ever
// rendered the full set)
const WEAR = new URLSearchParams(location.search).get('wear') || 'full';
// ?bg=magenta: chroma-key background — for exporting ChatGPT source boards
const BG = new URLSearchParams(location.search).get('bg') === 'magenta' ? '#ff00ff' : '#3c4048';
// mirrored production angles: rendered from the base dir with a negative
// x-scale, exactly how the game mirrors (v2.3.1349b)
const MIRROR = { west: 'east', northwest: 'northeast', southeast: 'southwest' };
const SKIN = 'default', PANTS = 'default', SHOES = 'default';
const wait = (ms) => new Promise(r => setTimeout(r, ms));

async function ready(fn, tries = 200) {
  for (let t = 0; t < tries; t++) {
    const v = fn();
    if (v) return v;
    await wait(50);
  }
  return null;
}

function drawTex(ctx, tex, dx, dy, scale = 1, flip = false) {
  const src = tex && tex.source && tex.source.resource;
  if (!src) return;
  const f = tex.frame;
  if (!flip) {
    ctx.drawImage(src, f.x, f.y, f.width, f.height, dx, dy, 256 * scale, 256 * scale);
  } else {
    ctx.save();
    ctx.translate(dx + 256 * scale, dy);
    ctx.scale(-1, 1);
    ctx.drawImage(src, f.x, f.y, f.width, f.height, 0, 0, 256 * scale, 256 * scale);
    ctx.restore();
  }
}

async function board(dir) {
  const base = MIRROR[dir] || dir;
  const flip = !!MIRROR[dir];
  const n = frameCount('jog', base) || 1;
  const cols = Math.min(n, 7);
  const rows = Math.ceil(n / cols);
  const Z = 1.6;
  const cv = document.createElement('canvas');
  cv.width = Math.round(cols * 256 * Z / 2) * 2;
  cv.height = Math.round(rows * 256 * Z / 2) * 2;
  cv.id = 'board-' + dir;
  const ctx = cv.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, cv.width, cv.height);
  for (let f = 0; f < n; f++) {
    const body = await ready(() => getBodyFrame(SKIN, PANTS, SHOES, 'jog', base, f, null, 'none'));
    const chest = await ready(() => getGearFrame('chest', 'steelplate', 'jog', base, f));
    const legs = await ready(() => getGearFrame('legs', 'steelgreaves', 'jog', base, f));
    const belt = await ready(() => getGearFrame('belt', 'chainbelt', 'jog', base, f), 60);
    if (f === 0) console.log('[harness]', dir, 'body=', !!body, 'chest=', !!chest, 'legs=', !!legs, 'belt=', !!belt);
    if (!body || !chest || !legs) continue;
    // v2.3.1361: the fullset figure replaces everything when it ships for
    // this dir (only jog-south so far); dirs without it keep the bake path.
    if (MODE !== 'body' && WEAR === 'full') {
      // v2.3.1367: draw by cycle phase — mirrors the game's native-count
      // playback for sheets whose frame count differs from the body's.
      const fs = await ready(() => getGearFramePhased('fullset', 'steel', 'jog', base, f / n), f === 0 ? 60 : 10);
      if (fs) {
        const dx = (f % cols) * 256 * Z, dy = Math.floor(f / cols) * 256 * Z;
        drawTex(ctx, fs, dx, dy, Z, flip);
        // v2.3.1368: the real head draws above the (helmet-less) fullset,
        // exactly as _placePickupHead does in-game.
        // v2.3.1389: same cycle phase as the armor — head frame-locked to it.
        const hd = await ready(() => getPickupHeadFrame(SKIN, PANTS, SHOES, 'jog', base, f, f / n), f === 0 ? 60 : 10);
        if (hd) {
          const hs = hd.frame ? 256 / hd.frame.width : 1;
          const src = hd.source && hd.source.resource;
          if (src) {
            ctx.save();
            if (flip) { ctx.translate(dx + 256 * Z, dy); ctx.scale(-1, 1); ctx.drawImage(src, hd.frame.x, hd.frame.y, hd.frame.width, hd.frame.height, 0, 0, 256 * Z, 256 * Z); }
            else ctx.drawImage(src, hd.frame.x, hd.frame.y, hd.frame.width, hd.frame.height, dx, dy, 256 * Z, 256 * Z);
            ctx.restore();
          }
        }
        ctx.fillStyle = '#ffdd44'; ctx.font = '20px monospace';
        ctx.fillText(dir + ' f' + f + ' (fullset)', dx + 8, dy + 24);
        continue;
      }
    }
    const worn = WEAR === 'chest' ? [{ k: 'chest:steelplate', tex: chest }]
      : WEAR === 'legs' ? [{ k: 'legs:steelgreaves', tex: legs }]
        : [{ k: 'chest:steelplate', tex: chest }, { k: 'legs:steelgreaves', tex: legs }];
    let masked = null;
    for (let t = 0; t < 40 && !masked; t++) {
      try { masked = _maskedBodyFrame(body, worn, 6, { pose: 'jog', dir: base, frameIdx: f }); } catch (e) { break; }
      if (masked && belt === null) break;
      if (!masked) await wait(50);
    }
    const dx = (f % cols) * 256 * Z, dy = Math.floor(f / cols) * 256 * Z;
    drawTex(ctx, masked || body, dx, dy, Z, flip);
    if (MODE !== 'body') {
      if (WEAR !== 'chest') drawTex(ctx, legs, dx, dy, Z, flip);
      if (WEAR !== 'legs') drawTex(ctx, chest, dx, dy, Z, flip);
    }
    ctx.fillStyle = '#ffdd44'; ctx.font = '20px monospace';
    ctx.fillText(dir + ' f' + f, dx + 8, dy + 24);
  }
  document.getElementById('boards').appendChild(cv);
}

/* ═══ v2.3.2325: ?measure=1 — IS THE ARMOURED BAKE LOSSLESS? ═══
   The owner reported the character reading "soft like the textures are low
   resolution".  One cause was mechanical and provable: this bake works at 256
   but is fed 128px DISPLAY textures, so every draw into it was an exact 2x
   pixel-double -- done BILINEAR, because canvas smoothing defaults on -- and
   the tail then resampled the whole composite back down to 128.  Exact texels
   in, two resamples, mush out.
   Boards answer that by eye, and by eye is how a half-texel blur survives.  So
   this measures it instead, on the one band where the answer is a clean yes/no:
   rows above the neck line are drawn from the body, erased, then redrawn
   VERBATIM under a clip, and the confinement loop below starts at neckY -- so
   nothing later touches them.  If the round trip is lossless those texels come
   out byte-identical to the raw body frame.  If anything resamples, they do
   not.  There is no third answer, and no threshold to argue about.
   Opaque texels only: source-over onto a partially-erased remnant is not an
   identity for partial alpha, and getImageData un-premultiplies lossily there
   -- both true before this change and after it, so they are not what is being
   measured.  Driven by tools/qa/bake-identity.mjs. */
async function measure() {
  const rows = [];
  const read = (tex) => {
    const src = tex && tex.source && tex.source.resource;
    if (!src) return null;
    const c = document.createElement('canvas'); c.width = 128; c.height = 128;
    const x = c.getContext('2d'); x.imageSmoothingEnabled = false;
    const f = tex.frame;
    x.drawImage(src, f.x, f.y, f.width, f.height, 0, 0, 128, 128);
    return x.getImageData(0, 0, 128, 128).data;
  };
  const bbox = (d) => {
    let t = 128, b = -1, l = 128, r = -1;
    for (let y = 0; y < 128; y++) for (let x = 0; x < 128; x++) {
      if (d[(y * 128 + x) * 4 + 3] > 0) {
        if (y < t) t = y; if (y > b) b = y;
        if (x < l) l = x; if (x > r) r = x;
      }
    }
    return { t, b, l, r };
  };
  const CASES = [
    { pose: 'jog', dir: 'south', f: 0, wear: 'chest' },
    { pose: 'jog', dir: 'south', f: 3, wear: 'both' },
    { pose: 'jog', dir: 'east', f: 0, wear: 'chest' },
    { pose: 'jog', dir: 'northeast', f: 0, wear: 'both' },
    { pose: 'stand', dir: 'south', f: 0, wear: 'chest' },
    { pose: 'stand', dir: 'east', f: 0, wear: 'both' },
  ];
  for (const c of CASES) {
    const body = await ready(() => getBodyFrame(SKIN, PANTS, SHOES, c.pose, c.dir, c.f, null, 'none'));
    const chest = await ready(() => getGearFrame('chest', 'steelplate', c.pose, c.dir, c.f));
    const legs = c.wear === 'both'
      ? await ready(() => getGearFrame('legs', 'steelgreaves', c.pose, c.dir, c.f)) : null;
    if (!body || !chest || (c.wear === 'both' && !legs)) {
      rows.push({ ...c, err: 'art missing', body: !!body, chest: !!chest, legs: !!legs });
      continue;
    }
    const worn = c.wear === 'both'
      ? [{ k: 'chest:steelplate', tex: chest }, { k: 'legs:steelgreaves', tex: legs }]
      : [{ k: 'chest:steelplate', tex: chest }];
    let masked = null;
    for (let t = 0; t < 40 && !masked; t++) {
      try { masked = _maskedBodyFrame(body, worn, 6, { pose: c.pose, dir: c.dir, frameIdx: c.f }); }
      catch (e) { rows.push({ ...c, err: String(e && e.message || e) }); break; }
      if (!masked) await wait(50);
    }
    if (!masked) { if (!rows.length || rows[rows.length - 1].pose !== c.pose) rows.push({ ...c, err: 'no bake' }); continue; }
    if (masked === body) { rows.push({ ...c, err: 'bake declined (raw body returned)' }); continue; }
    const A = read(body), B = read(masked);
    if (!A || !B) { rows.push({ ...c, err: 'unreadable' }); continue; }
    /* The bake finds the neck line in 256-space from alpha>40; mirror it in
       128-space and then stop TWO rows short, so a rounding difference of one
       row between the two spaces cannot put the neck restore itself inside
       the band being measured. */
    let figTop = 128, figBot = -1;
    for (let y = 0; y < 128; y++) for (let x = 0; x < 128; x++) {
      if (A[(y * 128 + x) * 4 + 3] > 40) { if (y < figTop) figTop = y; if (y > figBot) figBot = y; break; }
    }
    const band = Math.max(0, Math.round(figTop + 0.33 * (figBot - figTop)) - 2);
    let opaque = 0, bad = 0, partialA = 0, partialB = 0;
    for (let p = 0; p < band * 128; p++) {
      const o = p * 4;
      if (A[o + 3] !== 255) continue;
      opaque++;
      if (A[o] !== B[o] || A[o + 1] !== B[o + 1] || A[o + 2] !== B[o + 2] || A[o + 3] !== B[o + 3]) bad++;
    }
    for (let p = 0; p < 128 * 128; p++) {
      if (A[p * 4 + 3] > 0 && A[p * 4 + 3] < 255) partialA++;
      if (B[p * 4 + 3] > 0 && B[p * 4 + 3] < 255) partialB++;
    }
    rows.push({ ...c, band, opaque, bad, partialA, partialB, bodyBox: bbox(A), maskBox: bbox(B) });
  }
  window.__bandCheck = rows;
}

(async () => {
  await loadPlayerSprites();
  if (new URLSearchParams(location.search).get('measure') === '1') {
    await measure();
    window.__done = true;
    return;
  }
  for (const d of DIRS) await board(d);
  for (const d of Object.keys(MIRROR)) await board(d);
  window.__done = true;
})();
</script>
</body>
</html>
