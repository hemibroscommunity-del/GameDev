<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=overlays-content"/>
<title>Hemi Bros ARPG v2.1</title>
<!-- ═══ v2.3.2191: THE HOME-SCREEN ICON (owner art drop) ═══
     Owner: "Can you use this image for the web app (that you save to your
     home page on iPhone) also configure it however you need to for android."

     Until now there was NEITHER an apple-touch-icon nor a manifest, so an
     installed launcher had nothing to show and iOS fell back to a
     screenshot of whatever the page looked like when you added it.  The
     three platforms want three different things and none of them reads the
     others:
       - iOS home screen reads apple-touch-icon ONLY (never the manifest),
         wants 180x180, and rounds the corners itself;
       - Android/Chrome reads the manifest's icons, wants 192 and 512, and
         CROPS a maskable one to a circle -- hence the separate padded file,
         or "BRO" and "TOWN" lose their outer letters;
       - the browser tab wants a small favicon.
     All four are the same artwork, generated from the owner's 1254px master
     (tools/dev/make-app-icons.mjs, so the set can be rebuilt from a new
     drop rather than hand-cut).

     NOTE the old `/favicon.svg` here pointed at src/public/favicon.svg, and
     Vite's publicDir is the REPO-ROOT public/ -- so that file has never been
     copied into dist at all.  Verified, not assumed: the request does not
     even fail loudly, it falls through to the SPA rewrite and comes back as
     index.html with Content-Type text/html, so the browser was being handed
     a web page where an icon should be and quietly drew nothing.  The PNGs
     below live in the directory that actually ships.  (src/public/ also
     holds _headers and _redirects, which are not reaching dist either --
     flagged to the owner rather than moved here, since redirects are
     production routing and not this change's business.) -->
<link rel="icon" type="image/png" sizes="32x32" href="/icons/app/favicon-32.png"/>
<link rel="icon" type="image/png" sizes="192x192" href="/icons/app/favicon-192.png"/>
<link rel="apple-touch-icon" href="/icons/app/icon-180.png"/>
<link rel="manifest" href="/manifest.webmanifest"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<!-- The name under the icon on an iPhone home screen.  Without this iOS
     uses <title>, which is "Hemi Bros ARPG v2.1" -- truncated to something
     like "Hemi Bros A…" and carrying a version number a player has no use
     for. -->
<meta name="apple-mobile-web-app-title" content="BroTown"/>
<meta name="application-name" content="BroTown"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="mobile-web-app-capable" content="yes"/>
<!-- v2.3.1240: match iOS Safari chrome to the dashboard's deep slate. -->
<meta name="theme-color" content="#10232A"/>
<meta name="screen-orientation" content="landscape"/>
<!-- v2.3.712: Press Start 2P added for the retro-arcade HEMI BROS wordmark
     (welcome modal + this loading screen).  Single weight (400).
     v2.3.715: Baloo 2 added for the welcome-menu labels/buttons (rounded,
     game-y -- the bold caps sans read like terminal text). -->
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Press+Start+2P&family=Raleway:wght@600;700;800&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400;1,700&display=swap" rel="stylesheet">
<!-- v2.3.717: welcome-theme art preloaded so the modal dresses with the
     first paint instead of popping in as CSS/JSX discover each image. -->
<link rel="preload" as="image" href="/ui/welcome/bg.webp">
<link rel="preload" as="image" href="/ui/welcome/platform.webp">
<link rel="preload" as="image" href="/ui/welcome/void.webp">
<!-- v2.3.801: the gold lettering is the header again (the v2.3.790
     tavern-banner art is retired). -->
<link rel="preload" as="image" href="/ui/welcome/logo-brotown.webp">
<link rel="preload" as="image" href="/ui/welcome/sword.webp">
<link rel="preload" as="image" href="/ui/welcome/scroll2.webp">
<!-- v2.3.804: trait-menu chrome (gem frame + gold divider, restored from
     the owner's v2.3.725 asset pack) -->
<link rel="preload" as="image" href="/ui/welcome/frame.webp">
<link rel="preload" as="image" href="/ui/welcome/divider.webp">
<link rel="preload" as="image" href="/ui/welcome/play-btn.webp">
</head>
<body>
<div id="root">
  <div id="bt-loading" style="position:fixed;inset:0;z-index:99999;background:#0b0c14;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Source Sans 3',sans-serif;">
    <div style="font-size:48px;margin-bottom:8px;">⚔️</div>
    <div style="font-size:22px;font-family:'Press Start 2P','Source Sans 3',sans-serif;color:#f5c542;text-shadow:0 3px 0 #6b4310,0 5px 0 rgba(0,0,0,.5);">HEMI BROS</div>
    <div style="font-size:12px;color:#5b52ff;font-weight:700;letter-spacing:.3em;margin:8px 0 24px;">ACTION RPG</div>
    <div style="display:flex;gap:6px;align-items:center;">
      <div style="width:8px;height:8px;border-radius:50%;background:#5b52ff;animation:bt-pulse 1s ease-in-out infinite;"></div>
      <div style="width:8px;height:8px;border-radius:50%;background:#5b52ff;animation:bt-pulse 1s ease-in-out .2s infinite;"></div>
      <div style="width:8px;height:8px;border-radius:50%;background:#5b52ff;animation:bt-pulse 1s ease-in-out .4s infinite;"></div>
    </div>
    <div style="font-size:11px;color:#96A2A0;margin-top:16px;">Loading game...</div>
    <div style="font-size:9px;color:#555;margin-top:8px;">v__BUILD_VERSION__ (__BUILD_SHA__)</div>
  </div>
  <style>@keyframes bt-pulse{0%,100%{opacity:.2;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}</style>
</div>
<script type="module" src="./main.jsx"></script>
</body>
</html>
