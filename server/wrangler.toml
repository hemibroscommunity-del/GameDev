name = "brotown-server"
main = "src/index.js"
compatibility_date = "2024-12-01"

# ═══ v2.3.2443: THE SERVER ON THE GAME'S OWN DOMAIN ═══
# The client has always reached this worker at its *.workers.dev address,
# while the game itself is served from brotown.net.  workers.dev is on a lot
# of DNS block lists (it is abused for phishing, so several filters block
# the whole zone), and a device behind one loads the game and then hangs on
# every call to the server -- which is exactly what the owner saw on
# 2026-09-10 ("No answer from the server after 12s", "Still connecting")
# while a GitHub runner joined the live room in 224ms (probe-room run #1).
# A custom domain on the game's zone takes the block list out of the path.
# ADDITIVE: the workers.dev address keeps working, so an old client is not
# cut off.  The client is switched over separately, AFTER this route is
# live and probed (deploy-order safety: a client pointed at a name that
# does not resolve yet would hold every player at "connecting").
routes = [
  { pattern = "api.brotown.net", custom_domain = true },
]

# ── v2.3.1664: on-chain score checkpoints (contracts/BroTownScores.sol) ──
# The feature is OFF until both of these are set, and the game is entirely
# unaffected while it is off (chainscore.js `_chainScoreConfigured`).
#
#   SCORES_CONTRACT — the deployed BroTownScores address.  Public data, so
#                     it lives here as a plain var.  Empty = feature off.
#   RELAYER_KEY     — the relayer's private key.  A SECRET, never in this
#                     file and never in git.  Set it with:
#                       npx wrangler secret put RELAYER_KEY
#                     or via the Cloudflare dashboard (Workers → Settings →
#                     Variables → Encrypt).  The Worker reads it, signs with
#                     it, and never logs or transmits it.
#   CHAIN_ID        — 43111 is Hemi mainnet; 743111 is the testnet.  Lives
#                     HERE, not the dashboard (see the warning below).
#   CHAIN_RPC       — optional RPC URL override; empty = the default
#                     https://rpc.hemi.network/rpc baked into onchain.js.
#
# v2.3.1682: EVERY plain var must live in this file.  Any value set in the
# Cloudflare dashboard is DELETED on the next auto-deploy, because deploys
# apply this [vars] block wholesale — a dashboard-set CHAIN_ID=743111 would
# silently flip back to mainnet on the next merge.  Secrets are the one
# exception: they survive deploys, which is why RELAYER_KEY goes in the
# dashboard/CLI and everything else goes here.
#
# Operator runbook: docs/specs/progression-onchain.md
[vars]
SCORES_CONTRACT = "0x98581239b4e35dc4c4f354ecbffa45f120e44a6d"   # v2.3.1702: BroTownScores on Hemi mainnet (43111), deployed 2026-08-13 by the owner via /deploy-scores.html
CHAIN_ID = "43111"
CHAIN_RPC = ""

# Durable Objects bindings
[[durable_objects.bindings]]
name = "GAME_ROOM"
class_name = "GameRoom"

[[durable_objects.bindings]]
name = "MARKETPLACE"
class_name = "Marketplace"

[[durable_objects.bindings]]
name = "LEADERBOARD"
class_name = "Leaderboard"

[[durable_objects.bindings]]
name = "ARENA"
class_name = "Arena"

[[durable_objects.bindings]]
name = "FEEDBACK"
class_name = "Feedback"

# Migration — SQLite-backed Durable Objects (required for free plan)
[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom", "Marketplace", "Leaderboard", "Arena", "Feedback"]
