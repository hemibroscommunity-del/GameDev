<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="face" x1="60" y1="5" x2="60" y2="116" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1D25" stop-opacity="0.97"/>
      <stop offset="0.46" stop-color="#152A34" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#1C3540" stop-opacity="0.97"/>
    </linearGradient>
    <linearGradient id="rim" x1="60" y1="2" x2="60" y2="118" gradientUnits="userSpaceOnUse">
